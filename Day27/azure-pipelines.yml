trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Use Python'

- script: |
    python --version
  displayName: 'Check Python Version'

- script: |
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
    python customer.py
  displayName: 'Run Python Application'